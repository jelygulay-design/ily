<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowers For You</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    height: 100vh;
    background: #f5eadf; /* KEEP YOUR BACKGROUND HERE */
    font-family: Georgia, serif;
}

/* MAIN SCENE */
.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-end;
}

/* TEXT */
.message {
    position: absolute;
    top: 10%;
    width: 100%;
    text-align: center;
    z-index: 20;
    animation: appear 2s ease forwards;
}

.message h1 {
    font-size: clamp(38px, 8vw, 80px);
    color: #7b3045;
    letter-spacing: 4px;
    text-shadow: 0 3px 8px rgba(0,0,0,.15);
}

.message p {
    margin-top: 12px;
    font-size: clamp(25px, 5vw, 50px);
    color: #b83255;
    font-style: italic;
}

/* BOUQUET */
.bouquet {
    position: relative;
    width: 500px;
    height: 600px;
    margin-bottom: -80px;
}

/* STEMS */
.stem {
    position: absolute;
    width: 7px;
    height: 390px;
    background: linear-gradient(to right, #315f38, #4f8b4e);
    bottom: 100px;
    left: 50%;
    transform-origin: bottom;
    border-radius: 10px;
}

.stem1 { transform: rotate(-28deg); }
.stem2 { transform: rotate(-15deg); }
.stem3 { transform: rotate(0deg); }
.stem4 { transform: rotate(15deg); }
.stem5 { transform: rotate(28deg); }
.stem6 { transform: rotate(-42deg); }
.stem7 { transform: rotate(42deg); }

/* FLOWER */
.flower {
    position: absolute;
    width: 100px;
    height: 100px;
    animation: sway 4s ease-in-out infinite;
    z-index: 10;
}

.flower1 { left: 70px; top: 90px; }
.flower2 { left: 175px; top: 30px; animation-delay: .5s; }
.flower3 { left: 280px; top: 90px; animation-delay: 1s; }
.flower4 { left: 125px; top: 150px; animation-delay: 1.5s; }
.flower5 { left: 230px; top: 155px; animation-delay: 2s; }
.flower6 { left: 15px; top: 175px; animation-delay: 2.5s; }
.flower7 { left: 335px; top: 175px; animation-delay: 3s; }

/* PETALS */
.petal {
    position: absolute;
    width: 45px;
    height: 65px;
    border-radius: 50%;
    top: 18px;
    left: 28px;
    transform-origin: 50% 80%;
}

.p1 { transform: rotate(0deg) translateY(-28px); }
.p2 { transform: rotate(72deg) translateY(-28px); }
.p3 { transform: rotate(144deg) translateY(-28px); }
.p4 { transform: rotate(216deg) translateY(-28px); }
.p5 { transform: rotate(288deg) translateY(-28px); }

/* FLOWER COLORS */
.pink .petal {
    background: linear-gradient(#ff8fab, #e85d82);
}

.red .petal {
    background: linear-gradient(#ff6b81, #c92f50);
}

.purple .petal {
    background: linear-gradient(#d9a7ff, #9255c7);
}

.white .petal {
    background: linear-gradient(#fff, #eadde3);
}

.yellow .petal {
    background: linear-gradient(#ffe681, #e7a93b);
}

/* CENTER */
.center {
    position: absolute;
    width: 32px;
    height: 32px;
    background: #ffd34d;
    border-radius: 50%;
    left: 34px;
    top: 34px;
    z-index: 5;
    box-shadow: 0 0 8px rgba(0,0,0,.2);
}

/* LEAVES */
.leaf {
    position: absolute;
    width: 80px;
    height: 35px;
    background: #477d45;
    border-radius: 100% 0 100% 0;
}

.leaf1 {
    left: 100px;
    bottom: 180px;
    transform: rotate(-30deg);
}

.leaf2 {
    right: 100px;
    bottom: 230px;
    transform: rotate(30deg);
}

.leaf3 {
    left: 170px;
    bottom: 130px;
    transform: rotate(25deg);
}

.leaf4 {
    right: 170px;
    bottom: 160px;
    transform: rotate(-25deg);
}

/* WRAP */
.wrap {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 270px;
    height: 170px;
    background: linear-gradient(135deg, #ead2b7, #c69c72);
    clip-path: polygon(5% 0, 95% 0, 75% 100%, 25% 100%);
    z-index: 15;
    box-shadow: 0 10px 20px rgba(0,0,0,.15);
}

.ribbon {
    position: absolute;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 35px;
    background: #a83250;
    border-radius: 50%;
    z-index: 18;
}

.ribbon::before,
.ribbon::after {
    content: "";
    position: absolute;
    width: 60px;
    height: 70px;
    background: #a83250;
    top: 10px;
}

.ribbon::before {
    right: 35px;
    transform: rotate(30deg);
}

.ribbon::after {
    left: 35px;
    transform: rotate(-30deg);
}

/* FALLING PETALS */
.falling {
    position: absolute;
    width: 15px;
    height: 20px;
    background: #f58ca8;
    border-radius: 100% 0 100% 0;
    top: -30px;
    animation: fall linear infinite;
    opacity: .8;
}

.falling:nth-child(1) {
    left: 10%;
    animation-duration: 7s;
}

.falling:nth-child(2) {
    left: 30%;
    animation-duration: 9s;
    animation-delay: 2s;
}

.falling:nth-child(3) {
    left: 55%;
    animation-duration: 8s;
    animation-delay: 1s;
}

.falling:nth-child(4) {
    left: 75%;
    animation-duration: 10s;
    animation-delay: 3s;
}

.falling:nth-child(5) {
    left: 90%;
    animation-duration: 7s;
    animation-delay: 4s;
}

/* ANIMATIONS */
@keyframes sway {
    0%, 100% {
        transform: rotate(-3deg);
    }

    50% {
        transform: rotate(3deg);
    }
}

@keyframes fall {
    0% {
        transform: translateY(-30px) rotate(0deg);
    }

    100% {
        transform: translateY(110vh) rotate(360deg);
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* MOBILE */
@media (max-width: 600px) {
    .bouquet {
        transform: scale(.75);
        margin-bottom: -60px;
    }

    .message {
        top: 8%;
    }
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="music" loop>
    <source src="c3844324-4a9b-47dd-8e03-9c1312e0b4ff.mp4" type="audio/mpeg">
</audio>

<div class="scene">

    <!-- FALLING PETALS -->
    <div class="falling"></div>
    <div class="falling"></div>
    <div class="falling"></div>
    <div class="falling"></div>
    <div class="falling"></div>

    <!-- MESSAGE -->
    <div class="message">
        <h1>Good Morning my Love ❤️</h1>
        <p>Flowers for you ❤️</p>
        <p>I Love You ❤️
        Hope you'll have a good day.</p>
    </div>

    <!-- BOUQUET -->
    <div class="bouquet">

        <!-- STEMS -->
        <div class="stem stem1"></div>
        <div class="stem stem2"></div>
        <div class="stem stem3"></div>
        <div class="stem stem4"></div>
        <div class="stem stem5"></div>
        <div class="stem stem6"></div>
        <div class="stem stem7"></div>

        <!-- FLOWER 1 -->
        <div class="flower flower1 pink">
            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="center"></div>
        </div>

        <!-- FLOWER 2 -->
        <div class="flower flower2 red">
            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="center"></div>
        </div>

        <!-- FLOWER 3 -->
        <div class="flower flower3 purple">
            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="center"></div>
        </div>

        <!-- FLOWER 4 -->
        <div class="flower flower4 white">
            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="center"></div>
        </div>

        <!-- FLOWER 5 -->
        <div class="flower flower5 yellow">
            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="center"></div>
        </div>

        <!-- FLOWER 6 -->
        <div class="flower flower6 pink">
            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="center"></div>
        </div>

        <!-- FLOWER 7 -->
        <div class="flower flower7 red">
            <div class="petal p1"></div>
            <div class="petal p2"></div>
            <div class="petal p3"></div>
            <div class="petal p4"></div>
            <div class="petal p5"></div>
            <div class="center"></div>
        </div>

        <!-- LEAVES -->
        <div class="leaf leaf1"></div>
        <div class="leaf leaf2"></div>
        <div class="leaf leaf3"></div>
        <div class="leaf leaf4"></div>

        <!-- WRAP -->
        <div class="wrap"></div>
        <div class="ribbon"></div>

    </div>

</div>

<script>
const music = document.getElementById("music");

/*
  Chrome/Edge normally block sound from autoplaying.
  The first time the user clicks/taps anywhere,
  the music starts automatically.
*/

function startMusic() {
    music.volume = 0.7;
    music.play().catch(error => {
        console.log("Music could not start:", error);
    });

    document.removeEventListener("click", startMusic);
    document.removeEventListener("touchstart", startMusic);
}

document.addEventListener("click", startMusic);
document.addEventListener("touchstart", startMusic);
</script>

</body>
</html>
